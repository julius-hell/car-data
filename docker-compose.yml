services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardata}
      POSTGRES_DB: ${POSTGRES_DB:-cardata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: the app reaches Postgres over the compose network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardata} -d ${POSTGRES_DB:-cardata}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cardata}:${POSTGRES_PASSWORD:-cardata}@postgres:5432/${POSTGRES_DB:-cardata}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cardata}:${POSTGRES_PASSWORD:-cardata}@postgres:5432/${POSTGRES_DB:-cardata}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_RATE_LIMIT: ${BETTER_AUTH_RATE_LIMIT:-on}
      PHOTO_DIR: /data/photos
    volumes:
      - photos:/data/photos
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  photos:
